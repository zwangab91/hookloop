[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hookloop"
version = "0.1.0"
description = "Daily AI short-form content agent: research 1M+ view hooks, write <=45s scripts, render vertical video, publish to TikTok / Instagram Reels / YouTube Shorts."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "pyyaml>=6",
  "pillow>=10",
  "numpy>=1.26",
  "soundfile>=0.12",
  "yt-dlp>=2024.10.0",
  "cryptography>=42",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]
local-asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
hookloop = "hookloop.cli:main"

[tool.setuptools.packages.find]
include = ["hookloop*"]

[tool.setuptools.package-data]
hookloop = ["demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
