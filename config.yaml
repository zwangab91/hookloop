# hookloop config: edit `handle` before going live. Secrets never go here (GitHub Actions secrets / .env).
# Secrets never go here; they come from environment variables (see .env.example).

niche: AI tools and AI engineering   # the area; topics are picked inside it every day
handle: "@zitaowang1"           # TikTok + Instagram; shown on every video + the end card

topics:
  mode: auto                  # auto: trend-first when view data exists (YouTube key / Apify), else Claude web search
  scan_hashtags: [ai, aitools, chatgpt, claudeai, aiagents, machinelearning, cursorai, artificialintelligence]
  trend_window_days: 14       # "trending" = 1M+ views on a video posted within this window
  trend_min_videos: 3         # fewer than this -> fall back to the web-search pick
  pool:                       # fallback candidates; rotated daily, never repeated inside rotation_days
    - Claude Code
    - ChatGPT
    - Gemini
    - Cursor
    - AI agents
    - MCP servers
    - Context engineering
    - RAG
    - LLM evals
    - Fine-tuning vs prompting
    - Open-weight models
    - How LLMs work
    - Vibe coding
    - AI for data analysis
  discover_trending: true
  rotation_days: 7

research:
  platforms: [tiktok, instagram, youtube]   # Step 2: where to search the hashtags
  min_views: 1000000                        # Step 3: only learn from 1M+ view videos
  max_age_days: 120
  analyze_top: 6                            # winners to "watch" per day
  hook_seconds: 10                          # Step 4: study the first 10 seconds
  transcriber: openai                       # openai | local | none

llm:
  model: claude-sonnet-5-5
  fast_model: claude-haiku-5-5              # used for the critic pass

script:
  max_seconds: 45                           # Step 5: hard cap, enforced after TTS
  cta: "Follow for one practical AI tip a day."
  persona: >-
    An ML engineer who has shipped AI systems at scale, explaining AI tools and how
    they actually work in plain words. One concrete, copyable idea per video.
    No hype, no filler, talks like a friend at a desk.

tts:
  provider: kokoro                          # kokoro (free/local) | openai | elevenlabs (your cloned voice)
  kokoro: {voice: am_michael, speed: 1.05}
  # elevenlabs: {voice_id: "YOUR_VOICE_ID", model_id: eleven_multilingual_v2}

render:
  music: ""                                 # optional path to a royalty-free loop
  theme: {accent: "#FF7A45", highlight: "#FFD54A"}

publish:
  mode: review                              # review = wait for your approval (Actions → Run workflow → approve) | auto = post immediately
  platforms:
    tiktok:    {enabled: true, method: direct, privacy: PUBLIC_TO_EVERYONE}   # method: inbox = drafts, 1 tap to post
    instagram: {enabled: true, share_to_feed: true}
    youtube:   {enabled: true, privacy: public, handle: "@ZitaoWang"}  # gets its own copy: @ZitaoWang + SUBSCRIBE
    webhook:   {enabled: false}             # fan out to X/LinkedIn/Threads via n8n or Make

growth:
  monetize_at_followers: 10000              # Step 7: notify + write a media kit when crossed
